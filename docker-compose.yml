
services:
  db:
    image: postgres:16-bookworm
    container_name: payshield-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Database name missing}
      POSTGRES_USER: ${POSTGRES_USER:?Database user missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password missing}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: payshield-api
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
